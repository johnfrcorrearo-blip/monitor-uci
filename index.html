<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador ECG - Móvil</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e28;
            --ecg-color: #00ff00;
            --spo2-color: #00d4ff;
            --text-color: #e0e0e0;
            --border-color: #2a2a35;
            --grid-color-major: rgba(0, 255, 0, 0.15);
            --grid-color-minor: rgba(0, 255, 0, 0.05);
        }

        /* Evitar scroll y asegurar que ocupe exactamente la pantalla */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Arial', sans-serif;
            overflow: hidden; box-sizing: border-box;
            display: flex; flex-direction: column;
        }

        /* Cabecera compacta */
        .header {
            display: flex; justify-content: space-between; padding: 6px 12px;
            background-color: var(--panel-bg); border-bottom: 1px solid var(--border-color);
            font-size: 0.75rem; align-items: center; flex-shrink: 0;
        }
        .patient-info { display: flex; gap: 10px; }
        .patient-info span { font-weight: bold; color: #fff; }
        .device-info { color: #888; font-family: monospace; display: none; } /* Oculto en móviles muy pequeños */

        @media(min-width: 600px) { .device-info { display: block; } }

        /* Contenedor principal ajustado al espacio restante */
        .main-container {
            display: flex; flex: 1; padding: 6px; gap: 6px;
            overflow: hidden; flex-direction: column;
        }

        @media (min-width: 768px) {
            .main-container { flex-direction: row; }
        }

        /* Columna de Gráficas */
        .graphics-column {
            flex: 3; display: flex; flex-direction: column; gap: 5px;
            min-height: 0; /* Vital para que flexbox comprima los canvas correctamente */
        }
        .graph-panel {
            background-color: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: 4px; display: flex; flex-direction: column; position: relative;
            flex: 1; overflow: hidden; min-height: 0;
        }
        
        .panel-label {
            position: absolute; top: 4px; left: 6px;
            font-size: 0.85rem; font-weight: bold; color: var(--ecg-color);
            background: rgba(30, 30, 40, 0.85); padding: 1px 4px; border-radius: 3px;
            z-index: 10;
        }

        .ecg-grid {
            background-size: 30px 30px, 30px 30px, 10px 10px, 10px 10px;
            background-image: 
                linear-gradient(var(--grid-color-major) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color-major) 1px, transparent 1px),
                linear-gradient(var(--grid-color-minor) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color-minor) 1px, transparent 1px);
        }

        canvas { flex: 1; width: 100%; height: 100%; display: block; }

        /* Panel Lateral / Inferior para Signos y Controles */
        .vitals-column {
            flex: 1; display: flex; flex-direction: row; gap: 6px; flex-shrink: 0;
        }

        @media (min-width: 768px) {
            .vitals-column { flex-direction: column; flex: 1; }
        }

        .vital-box {
            background-color: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: 4px; padding: 8px; text-align: center;
            display: flex; flex-direction: column; justify-content: center; flex: 1;
        }
        .vital-title { font-size: 0.75rem; font-weight: bold; }
        .vital-value { font-size: 1.8rem; font-weight: bold; margin: 2px 0; }
        
        @media (min-width: 768px) {
            .vital-value { font-size: 3rem; }
        }

        .controls {
            background-color: #2c2c3a; padding: 6px; border-radius: 4px;
            display: flex; gap: 5px; align-items: center; justify-content: center; flex: 1;
        }
        button {
            padding: 6px 10px; background-color: #0078d7; color: white; border: none;
            border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.75rem;
        }
        button:hover { background-color: #005a9e; }
    </style>
</head>
<body>

    <div class="header">
        <div class="patient-info">
            <div>Pac: <span>Demo</span></div>
            <div>ID: <span>123456</span></div>
        </div>
        <div class="device-info">25mm/s | 10mm/mV | 50Hz</div>
    </div>

    <div class="main-container">
        <!-- Columna de Gráficas compactas -->
        <div class="graphics-column">
            <div class="graph-panel ecg-grid">
                <div class="panel-label">I</div>
                <canvas id="canvasI"></canvas>
            </div>
            <div class="graph-panel ecg-grid">
                <div class="panel-label">II</div>
                <canvas id="canvasII"></canvas>
            </div>
            <div class="graph-panel ecg-grid">
                <div class="panel-label">III</div>
                <canvas id="canvasIII"></canvas>
            </div>
            <div class="graph-panel" style="flex: 0.8;">
                <div class="panel-label" style="color: var(--spo2-color);">PLETH</div>
                <canvas id="canvasSpo2" style="background: #121212;"></canvas>
            </div>
        </div>

        <!-- Panel de Signos y Controles adaptado a móvil -->
        <div class="vitals-column">
            <div class="vital-box">
                <div class="vital-title" style="color: var(--ecg-color);">FC (BPM)</div>
                <div class="vital-value" style="color: var(--ecg-color);" id="bpmDisplay">75</div>
            </div>
            <div class="vital-box">
                <div class="vital-title" style="color: var(--spo2-color);">SpO2 %</div>
                <div class="vital-value" style="color: var(--spo2-color);" id="spo2Display">98</div>
            </div>
            <div class="controls">
                <button onclick="changeBPM(60)">Norm</button>
                <button onclick="changeBPM(120)" style="background-color: #d78a00;">Taq</button>
                <button onclick="changeBPM(40)" style="background-color: #00d7bd;">Brad</button>
            </div>
        </div>
    </div>

    <script>
        const channels = [
            { id: 'canvasI', ctx: null, x: 0, lastY: 0, type: 'ecg', ampModifier: 0.8, color: '#00ff00' },
            { id: 'canvasII', ctx: null, x: 0, lastY: 0, type: 'ecg', ampModifier: 1.2, color: '#00ff00' },
            { id: 'canvasIII', ctx: null, x: 0, lastY: 0, type: 'ecg', ampModifier: 0.5, color: '#00ff00' },
            { id: 'canvasSpo2', ctx: null, x: 0, lastY: 0, type: 'spo2', ampModifier: 1.0, color: '#00d4ff' }
        ];

        let baseBpm = 75;
        const speed = 2.5;
        const eraseWidth = 25;
        let time = 0;

        function initCanvases() {
            channels.forEach(ch => {
                const canvas = document.getElementById(ch.id);
                ch.ctx = canvas.getContext('2d');
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
                ch.lastY = canvas.height / 2;
                ch.width = canvas.width;
                ch.height = canvas.height;
            });
        }

        window.addEventListener('resize', initCanvases);
        initCanvases();

        function getECGValue(t, modifier) {
            const cycle = t % 100;
            let val = 0;
            if (cycle > 10 && cycle < 20) val = Math.sin((cycle - 10) * Math.PI / 10) * 0.15;
            else if (cycle > 30 && cycle < 35) val = -Math.sin((cycle - 30) * Math.PI / 5) * 0.2;
            else if (cycle >= 35 && cycle < 40) val = Math.sin((cycle - 35) * Math.PI / 5) * 1.5;
            else if (cycle >= 40 && cycle < 45) val = -Math.sin((cycle - 40) * Math.PI / 5) * 0.4;
            else if (cycle > 60 && cycle < 80) val = Math.sin((cycle - 60) * Math.PI / 20) * 0.3;
            return (val * modifier) + (Math.random() - 0.5) * 0.03;
        }

        function getSPO2Value(t) {
            const cycle = (t - 15) % 100; 
            let val = 0;
            if (cycle >= 0 && cycle < 45) val = Math.sin(cycle * Math.PI / 45) * 0.8;
            else if (cycle >= 45 && cycle < 85) val = Math.sin((cycle - 45) * Math.PI / 40) * 0.3 + 0.2;
            return val;
        }

        function drawLoop() {
            channels.forEach(ch => {
                const centerY = ch.type === 'spo2' ? ch.height / 1.5 : ch.height / 2;
                const amplitude = ch.height / 2.8;
                
                let signal = 0;
                if (ch.type === 'ecg') signal = getECGValue(time, ch.ampModifier);
                if (ch.type === 'spo2') signal = getSPO2Value(time);

                const y = centerY - (signal * amplitude);

                ch.ctx.beginPath();
                ch.ctx.moveTo(ch.x - speed, ch.lastY);
                ch.ctx.lineTo(ch.x, y);
                ch.ctx.strokeStyle = ch.color;
                ch.ctx.lineWidth = 1.5;
                ch.ctx.stroke();

                ch.ctx.clearRect(ch.x + 1, 0, eraseWidth, ch.height);

                ch.lastY = y;
                ch.x += speed;

                if (ch.x > ch.width) ch.x = 0;
            });

            time += (baseBpm / 60) * 0.8;
            requestAnimationFrame(drawLoop);
        }

        function changeBPM(newBpm) {
            baseBpm = newBpm;
            document.getElementById('bpmDisplay').innerText = baseBpm;
        }

        drawLoop();
    </script>
</body>
</html>
