<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador ECG - Monitor Clínico</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #1a1a24;
            --ecg-color: #00ff00;
            --spo2-color: #00d4ff;
            --text-color: #ffffff;
            --border-color: #333344;
            --temp-color: #ffcc00;
            --fr-color: #ff5555;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; overflow: hidden;
        }

        .header {
            display: flex; justify-content: space-between; padding: 10px 20px;
            background-color: var(--panel-bg); border-bottom: 2px solid var(--border-color);
            font-weight: bold; font-size: 1.2rem; text-transform: uppercase;
        }
        .header .title-blue { color: var(--spo2-color); }
        .header .title-yellow { color: var(--temp-color); }

        .main-container {
            display: flex; flex: 1; padding: 10px; gap: 10px; box-sizing: border-box;
        }

        /* Paneles Gráficos */
        .graphics-column {
            flex: 3; display: flex; flex-direction: column; gap: 10px;
        }
        .graph-panel {
            background-color: var(--panel-bg); border: 2px solid var(--border-color);
            border-radius: 8px; display: flex; flex-direction: column; padding: 10px;
        }
        .ecg-panel { flex: 2; } /* Más grande para darle prelación */
        .spo2-panel { flex: 1; } /* Más pequeño en la parte inferior */
        
        .panel-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        canvas { flex: 1; width: 100%; background-color: #050505; border-radius: 4px; }

        /* Panel de Valores (Lateral) */
        .vitals-column {
            flex: 1; display: flex; flex-direction: column; gap: 10px;
        }
        .vital-box {
            background-color: var(--panel-bg); border: 2px solid var(--border-color);
            border-radius: 8px; padding: 15px; text-align: center;
            display: flex; flex-direction: column; justify-content: center; flex: 1;
        }
        .vital-title { font-size: 1.2rem; font-weight: bold; }
        .vital-value { font-size: 5rem; font-weight: bold; margin: 5px 0; line-height: 1; }
        .vital-unit { font-size: 1rem; color: #aaaaaa; }

        /* Contenedor de signos pequeños abajo a la derecha */
        .small-vitals {
            display: flex; gap: 10px; flex: 0.5;
        }
        .small-vital-box {
            flex: 1; background-color: var(--panel-bg); border: 2px solid var(--border-color);
            border-radius: 8px; display: flex; flex-direction: column; justify-content: center;
            align-items: center; padding: 5px;
        }
        .small-vital-value { font-size: 2rem; font-weight: bold; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .graphics-column { flex: 2; }
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="title-blue">MONITOR CLÍNICO UCI</span>
        <span class="title-yellow">SIMULADOR OFFLINE</span>
    </div>

    <div class="main-container">
        <!-- Columna de Gráficas -->
        <div class="graphics-column">
            <div class="graph-panel ecg-panel">
                <div class="panel-title">ECG CANAL I (D1)</div>
                <canvas id="ecgCanvas"></canvas>
            </div>
            <div class="graph-panel spo2-panel">
                <div class="panel-title">PLETH CAPILAR (IR)</div>
                <canvas id="spo2Canvas"></canvas>
            </div>
        </div>

        <!-- Columna de Signos Vitales -->
        <div class="vitals-column">
            <!-- Frecuencia Cardíaca -->
            <div class="vital-box">
                <div class="vital-title" style="color: var(--ecg-color);">FREC. CARDÍACA</div>
                <div class="vital-value" style="color: var(--ecg-color);" id="bpmValue">79</div>
                <div class="vital-unit">BPM<br><span style="font-size: 0.8rem;" id="rrValue">Int. R-R: 759 ms</span></div>
            </div>
            
            <!-- Saturación -->
            <div class="vital-box" style="border-color: var(--spo2-color);">
                <div class="vital-title" style="color: var(--spo2-color);">SATURACIÓN O2</div>
                <div class="vital-value" style="color: var(--spo2-color);" id="spo2Value">98</div>
                <div class="vital-unit" style="color: var(--spo2-color);">%<br><span style="font-size: 0.8rem; color: #aaa;">Amp. Pulso: 84%</span></div>
            </div>

            <!-- Signos Pequeños (Temp, FR) -->
            <div class="small-vitals">
                <div class="small-vital-box" style="border-color: var(--temp-color);">
                    <div class="vital-unit" style="color: var(--temp-color);">🌡️ TEMP</div>
                    <div class="small-vital-value" style="color: var(--temp-color);" id="tempValue">36.5°</div>
                </div>
                <div class="small-vital-box" style="border-color: var(--fr-color);">
                    <div class="vital-unit" style="color: var(--fr-color);">🫁 F.R.</div>
                    <div class="small-vital-value" style="color: var(--fr-color);" id="frValue">15</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuración de Canvas
        const ecgCanvas = document.getElementById('ecgCanvas');
        const spo2Canvas = document.getElementById('spo2Canvas');
        const ctxEcg = ecgCanvas.getContext('2d');
        const ctxSpo2 = spo2Canvas.getContext('2d');

        function resizeCanvases() {
            ecgCanvas.width = ecgCanvas.parentElement.clientWidth - 20;
            ecgCanvas.height = ecgCanvas.parentElement.clientHeight - 40;
            spo2Canvas.width = spo2Canvas.parentElement.clientWidth - 20;
            spo2Canvas.height = spo2Canvas.parentElement.clientHeight - 40;
        }
        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        // Variables Globales de Simulación
        let baseBpm = 79;
        const speed = 2.5;
        const eraseWidth = 25;
        
        let xEcg = 0, xSpo2 = 0;
        let lastYEcg = ecgCanvas.height / 2;
        let lastYSpo2 = spo2Canvas.height / 2;
        let time = 0;

        // Modelos Matemáticos
        function getECGValue(t) {
            const cycle = t % 100;
            let val = 0;
            if (cycle > 10 && cycle < 20) val = Math.sin((cycle - 10) * Math.PI / 10) * 0.15; // P
            else if (cycle > 30 && cycle < 35) val = -Math.sin((cycle - 30) * Math.PI / 5) * 0.2; // Q
            else if (cycle >= 35 && cycle < 40) val = Math.sin((cycle - 35) * Math.PI / 5) * 1.5; // R
            else if (cycle >= 40 && cycle < 45) val = -Math.sin((cycle - 40) * Math.PI / 5) * 0.4; // S
            else if (cycle > 60 && cycle < 80) val = Math.sin((cycle - 60) * Math.PI / 20) * 0.3; // T
            return val + (Math.random() - 0.5) * 0.05; // Ruido
        }

        function getSPO2Value(t) {
            // Onda dicroica típica de pletismografía
            const cycle = (t - 15) % 100; // Desfasada respecto al ECG
            let val = 0;
            if (cycle >= 0 && cycle < 45) {
                val = Math.sin(cycle * Math.PI / 45) * 0.8;
            } else if (cycle >= 45 && cycle < 85) {
                val = Math.sin((cycle - 45) * Math.PI / 40) * 0.3 + 0.2;
            }
            return val;
        }

        // Bucle de Renderizado Principal
        function drawSignals() {
            // --- DIBUJAR ECG ---
            const centerY_Ecg = ecgCanvas.height / 2;
            const amp_Ecg = ecgCanvas.height / 3;
            const yEcg = centerY_Ecg - (getECGValue(time) * amp_Ecg);

            ctxEcg.beginPath();
            ctxEcg.moveTo(xEcg - speed, lastYEcg);
            ctxEcg.lineTo(xEcg, yEcg);
            ctxEcg.strokeStyle = '#00ff00';
            ctxEcg.lineWidth = 2.5;
            ctxEcg.stroke();
            ctxEcg.clearRect(xEcg + 1, 0, eraseWidth, ecgCanvas.height);
            lastYEcg = yEcg;
            xEcg += speed;
            if (xEcg > ecgCanvas.width) xEcg = 0;

            // --- DIBUJAR SPO2 (Pleth) ---
            const centerY_Spo2 = spo2Canvas.height / 1.5;
            const amp_Spo2 = spo2Canvas.height / 2.5;
            const ySpo2 = centerY_Spo2 - (getSPO2Value(time) * amp_Spo2);

            ctxSpo2.beginPath();
            ctxSpo2.moveTo(xSpo2 - speed, lastYSpo2);
            ctxSpo2.lineTo(xSpo2, ySpo2);
            ctxSpo2.strokeStyle = '#00d4ff';
            ctxSpo2.lineWidth = 3;
            ctxSpo2.stroke();
            ctxSpo2.clearRect(xSpo2 + 1, 0, eraseWidth, spo2Canvas.height);
            lastYSpo2 = ySpo2;
            xSpo2 += speed;
            if (xSpo2 > spo2Canvas.width) xSpo2 = 0;

            // Avanzar el tiempo
            time += (baseBpm / 60) * 0.8;

            requestAnimationFrame(drawSignals);
        }

        // Iniciar fondos oscuros
        ctxEcg.fillStyle = '#050505'; ctxEcg.fillRect(0, 0, ecgCanvas.width, ecgCanvas.height);
        ctxSpo2.fillStyle = '#050505'; ctxSpo2.fillRect(0, 0, spo2Canvas.width, spo2Canvas.height);
        
        // Iniciar animación
        drawSignals();
    </script>
</body>
</html>
